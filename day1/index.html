<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do web</title>
    <style>
        *{
    padding:0;
    margin:0;
    box-sizing:border-box;
}

body{
    background-color:#f5f5f5;
    font-family:Arial, sans-serif;
}


/* Navbar */
#nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:60px;
    padding:0 30px;

    background-color:#38c0dc;
    color:white;
    font-size:20px;
}


/* Main Card */
#main{

    width:400px;
    min-height:500px;

    margin:40px auto;

    background-color:#eeeeee;

    border:2px solid black;
    border-radius:40px;

    overflow:hidden;

}


/* Heading */
#nav1{

    height:60px;

    background-color:gold;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    font-weight:bold;

}



/* Task area */
#task{

    padding:30px;

}


/* Input */
input{

    width:100%;
    height:40px;

    padding:10px;

    border-radius:10px;
    border:1px solid gray;

    font-size:16px;

}


/* Button */
button{

    width:100%;
    height:40px;

    margin-top:15px;

    background-color:#38c0dc;

    color:white;

    border:none;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

}


/* Fake tasks */
.task-item{

    background:white;

    margin-top:20px;

    padding:15px;

    border-radius:15px;

    display:flex;
    

}



input[type="checkbox"]{
    appearance:none;   /* removes default checkbox */

    width:18px;
    height:18px;
    margin-right: 5px;

    background:white;

    border:1px solid black;

    border-radius:4px;

    cursor:pointer;
}
input[type="checkbox"]:checked{
    background-color:black;
    position:relative;
}


input[type="checkbox"]:checked::after{

    content:"✓";

    color:white;

    position:absolute;

    left:3px;
    top:-2px;

    font-size:16px;

}
        </style>
        
</head>
<body>
    <nav id="nav"> 
        <div id="logo">
            TO-DO 
        </div>
        <div id="links">
            <a>Home</a>
        </div>
    </nav>

    <div id="parent">
        <div id="main">

        
            <div id="nav1">
                YOUR TASK
            </div>
            <div id="task">
                <input placeholder="Enter your task">

    <button id="addTask">Add Task</button>


    <div class="task-item">
        <input type="checkbox">
        Learn JavaScript
    </div>


    <div class="task-item">
        <input type="checkbox">
        Practice DOM
    </div>

</div>
            </div>
        </div>
    </div>

    <script>
const addTask = document.getElementById("addTask");

addTask.addEventListener("click", ()=>{
    alert("hello");
});
        </script>
</body>
</html>
